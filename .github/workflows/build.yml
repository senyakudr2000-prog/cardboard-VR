name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack source ZIP
        run: |
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "Using $ZIP"
          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -d _src
          # if the ZIP has a single top-level folder, go inside it
          if [ "$(ls -A _src | wc -l)" -eq 1 ] && [ -d "_src/$(ls -A _src)" ]; then
            echo "PROJECT_DIR=_src/$(ls -A _src)" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=_src" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build .jar
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload .jar
        uses: actions/upload-artifact@v4
        with:
          name: cardboardvr-mod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
